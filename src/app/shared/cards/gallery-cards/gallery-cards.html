<div class="gallery-card text-white flex-shrink-0">
  <div class="gallery-card-inner">
    <div class="text-mask-window" data-mask-root>
      <svg class="text-mask-svg poppins-font boldest" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <mask [attr.id]="'tfv-text-mask-' + (card?.dataTarget ? card.dataTarget : card?.title)" maskUnits="userSpaceOnUse">
            <rect x="0" y="0" width="1200" height="1200" fill="black"/>
            <!-- Make text occupy ~80% of the SVG width consistently on all devices -->
            <text x="50%" y="50%"
                  dominant-baseline="middle"
                  alignment-baseline="middle"
                  dy=".1em"
                  text-anchor="middle"
                  lengthAdjust="spacingAndGlyphs"
                  textLength="1200"
                  font-size="1200"
                  fill="white"
                  class="mask-svg-text poppins-font boldest">{{card?.title}}</text>
          </mask>
        </defs>
        <g [attr.mask]="card?.dataTarget ? 'url(#tfv-text-mask-' + card.dataTarget + ')' : 'url(#tfv-text-mask-' + card?.title + ')'" data-mask-images>
          @if (card?.images?.length) {
            @for (img of card.images; track $index) {
              <image class="mask-slide" [attr.href]="img" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" />
            }
          } @else {
            <image class="mask-slide" [attr.href]="card?.image" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" />
            <image class="mask-slide" [attr.href]="card?.image" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" />
            <image class="mask-slide" [attr.href]="card?.image" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" />
            <image class="mask-slide" [attr.href]="card?.image" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" />
          }
        </g>
      </svg>
    </div>

    <div class="overlay-center">
      <!-- Explore more button -->
      <button type="button" class="btn btn-light  mt-1 poppins-font thin gallery-explore-btn"   aria-label="Explore more" (click)="onExplore()">Explore Photos</button>
      <div class="gallery-scroll-arrow d-flex justify-content-center custom-arrow"
           [attr.data-target]="card?.dataTarget" role="button" tabindex="0" aria-label="Next">
        @if (!card?.lastCategory) {
          <i class="bi bi-chevron-double-right scroll-icon text-color"></i>
        } @else {
          <i class="bi bi-chevron-double-down scroll-icon text-color"></i>
        }
      </div>
    </div>
  </div>
</div>
